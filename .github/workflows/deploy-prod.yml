name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches: [cf-production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      OCIR_HOST: ocir.us-ashburn-1.oci.oraclecloud.com
      OCIR_REPO: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ssr-server

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-production

      - name: Setting up node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Install Client Dependencies
        working-directory: ./ui-app/client
        run: npm i

      - name: Setup rClone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.CLOUDFLARE_RCLONE_CONFIG }}

      - uses: cloudposse/github-action-jq@main
        name: Installing jq
        with:
          compact: true
          input: '["test", "test2", "test3"]'
          script: |-
            map(select(. == "test"))

      - name: Building to JS
        working-directory: ./ui-app/client
        run: npm run cf-prod

      - name: Generate Component Catalog
        working-directory: ./ui-app/client
        run: npm run generate-catalog

      - name: Copy manifest for SSR
        run: |
          mkdir -p ui-app/ssr/manifests
          cp ./ui-app/client/dist/asset-manifest.json ui-app/ssr/manifests/asset-manifest.json

      - name: Pushing Prod to Cloudflare
        working-directory: ./ui-app/client
        run: |
          rclone copy ./dist r2user:prod-static/js/dist

          echo "\n"
          echo "JSON prepared :"
          find dist -type f | xargs -d '\n' -n 25 | while IFS= read -r batch; do echo "$batch" | tr ' ' '\n' | jq -R -s '{"files": split("\n")[:-1] | map("https://cdn.modlix.com/js/" + .)}'; done

          echo "Calling purge for cdn.modlix.com :"
          find dist -type f | xargs -d '\n' -n 25 | while IFS= read -r batch; do echo "$batch" | tr ' ' '\n' | jq -R -s '{"files": split("\n")[:-1] | map("https://cdn.modlix.com/js/" + .)}' | curl https://api.cloudflare.com/client/v4/zones/f8fe46c016fcfdc188401768a0ac7d01/purge_cache --request POST --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" --header "Content-Type: application/json"  --data @- ; echo ""; done

      - name: Invalidating Application Server cache
        run: |
          curl -s --header "Authorization: ${{ secrets.NOCODE_TOKEN }}" https://apps.modlix.com/api/ui/newdeployment

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_NON_PROD_CLI_AUTH_TOKEN }}" | docker login $OCIR_HOST \
            -u "${{ secrets.OCI_NON_PROD_DOCKER_USER_NAME }}" \
            --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $OCIR_REPO:${{ github.sha }} \
                       -t $OCIR_REPO:latest \
                       -f ui-app/ssr/Dockerfile .
          docker push $OCIR_REPO:${{ github.sha }}
          docker push $OCIR_REPO:latest

  deploy-ssr:
    needs: build-and-deploy
    runs-on: self-hosted

    steps:
      - name: Deploy to production server
        run: |
          ssh -i /home/ubuntu/keys/prod-internal.key opc@${{ secrets.PROD_SERVER_IP }} \
            "set -o pipefail; bash /home/opc/scripts/keepup.sh deploy ssr-server ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ssr-server:${{ needs.build-and-deploy.outputs.image_tag }} 2>&1 | tee -a /var/log/keepup.log"

  # Regional SSR nodes. A separate job per region rather than a matrix, because
  # the `secrets` context is not available inside `strategy.matrix`, and rather
  # than extra steps in the job above, because a region that fails to deploy must
  # not mark the Ashburn deployment as failed or block the next region.
  #
  # The image is the same one Ashburn runs, pulled from the Ashburn registry --
  # prod-in-bridge-01 already does exactly this from Mumbai, so the path is
  # proven. What differs per region is the SSR_REGION the container starts with,
  # which selects the `ssr-<region>.` block in the config server; that lives in
  # the region's compose file, not here.
  #
  # No ProxyJump, for the same reason the whatsapp-bridge workflow documents: the
  # self-hosted runner IS the jumphost (172.16.0.107), so a -J hop would make it
  # connect to its own public IP and time out. Mumbai's subnet admits SSH from
  # 172.16.0.0/16 over the DRG peering, which is exactly where the runner sits.
  deploy-ssr-in:
    needs: build-and-deploy
    runs-on: self-hosted

    steps:
      # prod-external.key, not the prod-internal.key the Ashburn job above uses.
      # The two hosts trust different keys and are deliberately kept that way, so
      # a key that reaches one does not reach the other. This key must be present
      # on the runner at the path below; it is the only prerequisite this job has
      # beyond the PROD_IN_LB_IP secret.
      - name: Deploy to Mumbai SSR node
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -i /home/ubuntu/keys/prod-external.key \
              opc@${{ secrets.PROD_IN_LB_IP }} \
            "set -o pipefail; bash /home/opc/scripts/keepup.sh deploy ssr-server ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ssr-server:${{ needs.build-and-deploy.outputs.image_tag }} 2>&1 | tee -a /var/log/keepup.log"
